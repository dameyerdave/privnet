{{define "title"}}Log in · privnet{{end}}
{{define "content"}}{{with .Page}}
<div class="auth card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to manage your networks and devices.</p>
  {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Email<input type="email" name="email" value="{{.Email}}" required autofocus autocomplete="email"></label>
    <label>Password<span class="pw-field"><input type="password" name="password" required autocomplete="current-password"><button type="button" class="pw-toggle" data-pw-toggle aria-label="Show password">Show</button></span></label>
    <button class="btn btn-block" data-busy="Logging in…">Log in</button>
  </form>
  {{if not .Closed}}<p class="muted center">No account yet? <a href="/signup">Create one</a></p>{{end}}
</div>
{{end}}{{end}}
