{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}privnet{{end}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <script src="{{asset "app.js"}}" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4"/><circle cx="6" cy="8" r="2.5"/><circle cx="26" cy="8" r="2.5"/><circle cx="6" cy="24" r="2.5"/><circle cx="26" cy="24" r="2.5"/><path d="M8 9.5 13 13M24 9.5 19 13M8 22.5l5-3.5M24 22.5 19 19"/></svg>
        <span>privnet</span>
      </a>
      <nav>
        {{if .User}}
          <a href="/networks">Networks</a>
          {{if .DNS}}<a href="/dns">DNS</a>{{end}}
          <span class="muted nav-email">{{.User.Email}}</span>
          <form method="post" action="/logout"><button class="link">Log out</button></form>
        {{else}}
          <a href="/login">Log in</a>
          <a class="btn btn-sm" href="/signup">Get started</a>
        {{end}}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{block "content" .}}{{end}}
  </main>
  <footer class="wrap footer muted">
    privnet · private WireGuard networks · hub-and-spoke over a single encrypted endpoint
  </footer>
</body>
</html>{{end}}
