{{define "title"}}Sign up · privnet{{end}}
{{define "content"}}{{with .Page}}
<div class="auth card">
  <h1>Create your account</h1>
  {{if .Closed}}
    <div class="alert">Sign-up is currently disabled on this instance.</div>
  {{else}}
    {{if .Error}}<div class="alert alert-error">{{.Error}}</div>{{end}}
    <form method="post" action="/signup" class="stack">
      <label>Email<input type="email" name="email" value="{{.Email}}" required autofocus autocomplete="email"></label>
      <label>Password<input type="password" name="password" minlength="10" required autocomplete="new-password">
        <small class="muted">At least 10 characters.</small></label>
      {{if .NeedCode}}<label>Invite code<input type="text" name="code" required></label>{{end}}
      <button class="btn btn-block">Create account</button>
    </form>
  {{end}}
  <p class="muted center">Already registered? <a href="/login">Log in</a></p>
</div>
{{end}}{{end}}
